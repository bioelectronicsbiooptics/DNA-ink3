[project]
name = "dna-ink3"
version = "0.1.0"
description = "iSCAN positional decoding + four-layer optimization stack for DNA data storage (iSCAN3)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Taeseok Kang",  email = "labmanager.bebo.inu@stdbioelec.com" },
    { name = "Doyeon Lim" },
    { name = "Wonjin Lee" },
    { name = "Jungwoo Kim" },
    { name = "Xiaohua Huang" },
    { name = "Jinchul Kim",  email = "jinchul@kribb.re.kr" },
    { name = "Youngjun Song", email = "yjunsong@inu.ac.kr" },
]
keywords = [
    "DNA data storage",
    "Reed-Solomon",
    "next-generation sequencing",
    "positional decoding",
    "iSCAN",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=2.3",
    "pandas>=2.3",
    "matplotlib>=3.10",
    "biopython>=1.85",
    "reedsolo>=1.7",
    "numba>=0.60",
    "scipy>=1.16",
    "trimesh>=4.11",
    "xlsxwriter>=3.2",
]

[project.optional-dependencies]
gpu = [
    "mlx>=0.30; platform_system == 'Darwin'",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.urls]
Homepage   = "https://github.com/bioelectronicsbiooptics/DNA-ink3"
Repository = "https://github.com/bioelectronicsbiooptics/DNA-ink3"
Issues     = "https://github.com/bioelectronicsbiooptics/DNA-ink3/issues"
"NCBI BioProject" = "https://www.ncbi.nlm.nih.gov/bioproject/PRJNA1091804"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python_pipeline"]
